[project]
name = "nexusx"
version = "7.0.0"
description = "Build SQLModel applications for people and AI — turn relationships into a batch-loaded query graph and typed methods into REST, GraphQL, MCP, and CLI interfaces"
authors = [{ name = "tangkikodo", email = "allmonday@126.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
keywords = ["sqlmodel", "graphql", "sqlalchemy", "fastapi", "mcp", "ai", "ai-agents", "model-context-protocol", "context-efficiency", "dataloader"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sqlmodel>=0.0.14",
    "pydantic>=2.0",
    "graphql-core>=3.2.0",
    "fastapi>=0.135.1",
    "aiodataloader>=0.4.3",
    "jinja2>=3.0",
]

[project.optional-dependencies]
demo = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.3.2",
]
fastmcp = [
    "fastmcp>=4.1",
]
federation = [
    "httpx>=0.27",
]
cli = [
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/KLR-Pattern/nexusx"
Repository = "https://github.com/KLR-Pattern/nexusx"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Loader()/Collector() as default args is the intended API pattern

[tool.mypy]
python_version = "3.10"
# Modules cleared under --strict are listed in the override below and are the
# ones CI checks (`scripts/check-ci.sh` / ci.yml pass them as targets, with
# follow_imports=silent so their not-yet-cleared imports do not block); the
# rest are checked at mypy's default level when you run `mypy src/nexusx`
# locally, until each is cleared (issue #160 M1 → M2 → M4). The config used to
# claim `strict = true` globally while 487 errors were outstanding — it now
# says what is true.
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# Cleared in 7.1.0 (spec 026): the leaf helpers, the loader layer, scanning.
module = [
    "nexusx.annotation_utils",
    "nexusx.decorator",
    "nexusx.relationship",
    "nexusx.context",
    "nexusx.discovery.*",
    "nexusx.scanning.*",
    "nexusx.utils.*",
    "nexusx.loader.registry",
    "nexusx.loader.factories",
    "nexusx.loader.composed",
    "nexusx.loader.pagination",
    "nexusx.loader.query_meta",
]
# mypy 2.1 applies ``strict`` inside an override globally (verified: an override
# for an unrelated module tightened every other module), so the strict bundle is
# spelled out per flag here.
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=nexusx --cov-report=term-missing"

[tool.coverage.run]
source = ["src/nexusx"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    "pass",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.4",
    "aiosqlite>=0.19.0",
    "fastmcp>=4.1",
    "typer>=0.12.0",
    "httpx>=0.27",
    "pytest-benchmark>=5.0.0",
    "greenlet>=3.3.2",
]
