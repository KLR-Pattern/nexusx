site_name: nexusx
site_description: "Next-generation business modeling with deep AI integration — GraphQL, REST, MCP, CLI, and TS SDK derived from one typed model."
site_url: https://allmonday.github.io/nexusx
site_author: tangkikodo
theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - header.autohide
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.links.target_blank
  font:
    text: Roboto
    code: Roboto Mono

repo_name: allmonday/nexusx
repo_url: https://github.com/allmonday/nexusx
edit_uri: ""

exclude_docs: |
  superpowers/

nav:
  - Guide:
    - Home: ./index.md
    - Overview — One Model, Two Graphs: ./guide/overview.md
    - Quick Start: ./guide/quick_start.md
    - Data Graph:
      - GraphQL Mode: ./guide/graphql_mode.md
      - Auto-Generated Queries: ./guide/graphql_auto_query.md
      - GraphQL Pagination: ./guide/graphql_pagination.md
    - Response DTOs:
      - Core API Mode: ./guide/core_api.md
      - Core API Advanced: ./guide/core_api_advanced.md
    - Relationships beyond the ORM:
      - ER Diagram & Non-ORM Relationships: ./guide/er_diagram.md
      - Custom Relationships: ./guide/custom_relationship.md
      - Virtual Entities: ./guide/virtual_entities.md
    - Operation Graph:
      - UseCase Service: ./advanced/use_case_service.md
      - UseCase + FastAPI: ./advanced/use_case_fastapi.md
    - AI Delivery:
      - Compose MCP for AI: ./advanced/compose_mcp.md
      - MCP Service (entity-first): ./advanced/mcp_service.md
      - MCP & Context Efficiency: ./mcp-context-efficiency.md
    - Beyond One Database:
      - Federation: ./advanced/federation.md
      - ComposedErManager: ./advanced/composed_er_manager.md
    - Tooling:
      - Voyager Visualization: ./advanced/voyager.md
      - ER Diagram Visualization: ./guide/er_diagram_visual.md
      - Troubleshooting: ./guide/troubleshooting.md
  - Articles:
    - Design Highlights: ./feature-highlights.md
    - Clean Architecture Comparison: ./clean-architecture-comparison.md
  - API Reference:
    - GraphQLHandler: ./api/api_graphql_handler.md
    - Core API: ./api/api_core.md
    - Cross-Layer Data Flow: ./api/api_cross_layer.md
    - Relationships & ER Diagram: ./api/api_relationship.md
    - MCP API: ./api/api_mcp.md
    - UseCase API: ./api/api_use_case.md
  - Reference:
    - Changelog: ./changelog.md
    - Migration Guide: ./reference/migration.md
    - DTO-first Execution Migration: ./migration/018-dto-first.md
    - UseCase GraphQL 3.0 Migration: ./migrations/3.0-use-case-graphql.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.superfences

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
          link: "/"
        - locale: zh
          name: 中文
          build: true
          link: "/zh/"
          nav_translations:
            Guide: "指南"
            Advanced: "进阶"
            API Reference: "API 参考"
            Reference: "参考"
            Overview: "总览"
            Quick Start: "快速开始"
            "ER Diagram & Non-ORM Relationships": "ER 图与非 ORM 关系"
            "GraphQL Mode": "GraphQL 模式"
            "GraphQL Pagination": "GraphQL 分页"
            "Auto-Generated Queries": "自动查询"
            "Core API Mode": "Core API 模式"
            "Core API Advanced": "Core API 进阶"
            "Virtual Entities": "虚拟实体"
            "Custom Relationships": "自定义关系"
            "ER Diagram Visualization": "ER 图可视化"
            "Troubleshooting": "常见问题"
            "MCP Service": "MCP 服务"
            "UseCase Service": "UseCase 服务"
            "UseCase + FastAPI": "UseCase + FastAPI"
            "Voyager Visualization": "Voyager 可视化"
            "Federation": "联邦"
            "Articles": "文集"
            "Design Highlights": "设计亮点"
